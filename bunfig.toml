[fmt]
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleQuote = true
jsxSingleQuote = false
quoteProps = "as-needed"
trailingComma = "es5"
arrowParens = "always"
bracketSameLine = false
bracketSpacing = true
singleAttributePerLine = false
endOfLine = "lf"
sortImports = true
ignorePatterns = ["dist/", ".astro/", "node_modules/", "public/", "bun.lock"]

[fmt.sortTailwindcss]
stylesheet = "./src/styles.css"
