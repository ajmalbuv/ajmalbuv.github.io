name: Build and Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun 🚀
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies 🔧
        run: bun install --frozen-lockfile

      - name: Type & Lint Check 🧹
        run: bun run check

      - name: Prettier Format Check 🎨
        run: bun run format:check

  github-pages:
    name: Deploy to GitHub Pages
    needs: [check]
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Install, build, and upload your site 🚀
        uses: withastro/action@v6
        with:
          package-manager: bun
        env:
          SITE: 'https://ajmalbuv.github.io'

      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5

  vps-deploy:
    name: Deploy to VPS Branch
    needs: [check]
    concurrency:
      group: 'vps'
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun 🚀
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies 🔧
        run: bun install --frozen-lockfile

      - name: Build 🏗️
        run: bun run build
        env:
          SITE: 'https://portfolio.ajmalbuv.duckdns.org'

      - name: Push to VPS branch 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: vps-build
          clean: true
          single-commit: true
